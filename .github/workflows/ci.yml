name: detection-as-code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  detections:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate rule schema, conditions and modifiers
        run: python -m huntforge validate

      - name: Run engine tests and per-rule fixtures
        run: python -m pytest -q

      - name: False-positive check against benign baseline telemetry
        run: python -m huntforge noise

      - name: Translate every rule to Splunk SPL
        run: python -m huntforge convert --target splunk --strict

      - name: Translate every rule to Elastic KQL
        run: python -m huntforge convert --target elastic --strict

      - name: Fail if the committed ATT&CK coverage report is stale
        run: python -m huntforge coverage --check
