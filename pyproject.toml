[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "huntforge"
version = "1.1.0"
description = "Detection-as-code: Sigma-style rules tested like software, translated to Splunk SPL, Kibana KQL and ES|QL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jampani Komal" }]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
huntforge = "huntforge.cli:main"

[tool.setuptools]
packages = ["huntforge"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["huntforge"]
